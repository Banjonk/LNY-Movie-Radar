name: Affiliate Link Health Checker (Movie Radar)

on:
  schedule:
    # รันอัตโนมัติทุกวันจันทร์ เวลา 09:00 น. ตามเวลาไทย (UTC คือ 02:00)
    - cron: '0 2 * * 1'
  # รองรับการกดปุ่ม Run workflow ด้วยตัวเองบนหน้าเว็บ GitHub เพื่อเทสระบบ
  workflow_dispatch:

jobs:
  check-affiliate-links:
    runs-on: ubuntu-latest

    steps:
      - name: 1. ดึงโค้ดจากโปรเจกต์ลงเครื่องเซิร์ฟเวอร์
        uses: actions/checkout@v4

      - name: 2. เตรียมระบบ Node.js เวอร์ชัน 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. สั่งรันสคริปต์ตรวจจับลิงก์
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node scripts/check_links.js